<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" shape-rendering="crispEdges">
  <!-- Warm-dark backdrop -->
  <rect width="1200" height="320" fill="#0E0D12"/>

  <!-- Pixel-art device frame (left), 240x240 internal preview at 2x = 240x240 logical, draw at 1x -->
  <g transform="translate(80,40)">
    <rect width="240" height="240" fill="#0E0D12" stroke="#2C2638" stroke-width="2"/>
    <!-- statusbar -->
    <rect x="0" y="0" width="240" height="22" fill="#181520"/>
    <rect x="0" y="22" width="240" height="1" fill="#FF6B5B"/>
    <!-- 4x4 spark logo, scaled up, centered top -->
    <g transform="translate(112,32) scale(4)" fill="#FFC857">
      <rect x="4" y="2" width="1" height="1"/>
      <rect x="11" y="2" width="1" height="1"/>
      <rect x="5" y="3" width="1" height="1"/>
      <rect x="10" y="3" width="1" height="1"/>
      <rect x="6" y="4" width="1" height="1"/>
      <rect x="9" y="4" width="1" height="1"/>
      <rect x="7" y="5" width="2" height="1"/>
      <rect x="1" y="6" width="6" height="1"/>
      <rect x="9" y="6" width="6" height="1"/>
      <rect x="1" y="7" width="6" height="1"/>
      <rect x="9" y="7" width="6" height="1"/>
      <rect x="7" y="8" width="2" height="1"/>
      <rect x="6" y="9" width="1" height="1"/>
      <rect x="9" y="9" width="1" height="1"/>
      <rect x="5" y="10" width="1" height="1"/>
      <rect x="10" y="10" width="1" height="1"/>
      <rect x="4" y="11" width="1" height="1"/>
      <rect x="11" y="11" width="1" height="1"/>
    </g>
    <!-- VT323-style "23:08" preview, hand-drawn rects (chunky) -->
    <g transform="translate(28,130)" fill="#F5EFE0">
      <!-- 2 -->
      <rect x="0"  y="0"  width="20" height="6"/>
      <rect x="16" y="6"  width="4"  height="14"/>
      <rect x="0"  y="20" width="20" height="6"/>
      <rect x="0"  y="26" width="4"  height="14"/>
      <rect x="0"  y="40" width="20" height="6"/>
      <!-- 3 -->
      <rect x="32" y="0"  width="20" height="6"/>
      <rect x="48" y="6"  width="4"  height="14"/>
      <rect x="32" y="20" width="20" height="6"/>
      <rect x="48" y="26" width="4"  height="14"/>
      <rect x="32" y="40" width="20" height="6"/>
    </g>
    <!-- coral ":" -->
    <g transform="translate(94,140)" fill="#FF6B5B">
      <rect x="0" y="0"  width="6" height="6"/>
      <rect x="0" y="20" width="6" height="6"/>
    </g>
    <!-- 0 8 amber -->
    <g transform="translate(112,130)" fill="#FFC857">
      <!-- 0 -->
      <rect x="0"  y="0"  width="20" height="6"/>
      <rect x="0"  y="6"  width="4"  height="34"/>
      <rect x="16" y="6"  width="4"  height="34"/>
      <rect x="0"  y="40" width="20" height="6"/>
      <!-- 8 -->
      <rect x="32" y="0"  width="20" height="6"/>
      <rect x="32" y="6"  width="4"  height="14"/>
      <rect x="48" y="6"  width="4"  height="14"/>
      <rect x="32" y="20" width="20" height="6"/>
      <rect x="32" y="26" width="4"  height="14"/>
      <rect x="48" y="26" width="4"  height="14"/>
      <rect x="32" y="40" width="20" height="6"/>
    </g>
    <!-- Subline -->
    <text x="120" y="210" fill="#7A6F86" font-family="monospace" font-size="11" text-anchor="middle">tue · may 17</text>
    <!-- CL bar -->
    <rect x="20" y="190" width="140" height="6" fill="#181520"/>
    <rect x="20" y="190" width="92"  height="6" fill="#FF6B5B"/>
  </g>

  <!-- Wordmark "glimmer" right of the device -->
  <g transform="translate(420,90)" font-family="Silkscreen, Menlo, monospace">
    <text x="0" y="80" font-size="120" font-weight="700" fill="#F5EFE0" letter-spacing="-2">glimmer</text>
    <text x="6" y="120" font-size="22" fill="#7A6F86" letter-spacing="6">A PIXEL-ART INFORMATION RADIATOR</text>
    <!-- Accent dot row -->
    <g transform="translate(6,148)">
      <rect width="14" height="14" fill="#FF6B5B"/>
      <rect x="22" width="14" height="14" fill="#FFC857"/>
      <rect x="44" width="14" height="14" fill="#B7E4A0"/>
      <rect x="66" width="14" height="14" fill="#7CC4FF"/>
      <rect x="88" width="14" height="14" fill="#B58CFF"/>
    </g>
    <text x="6" y="190" font-size="14" fill="#C9BFB0">GeekMagic SmallTV-Ultra · ESP8266 · 240×240 ST7789</text>
  </g>
</svg>
